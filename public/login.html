<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Smart Bot Trading Console Login</title>
  <meta name="description" content="Login untuk Smart Bot Dashboard">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3f8;
      --panel: rgba(255, 255, 255, 0.9);
      --line: #d4dfed;
      --text: #142136;
      --muted: #5f6f85;
      --accent: #0f766e;
      --accent-2: #0ea5e9;
      --danger: #b42318;
      --shadow: 0 24px 52px rgba(8, 20, 38, 0.11);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      font-family: "Sora", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 12%, rgba(15,118,110,0.12), transparent 30%),
        radial-gradient(circle at 88% 3%, rgba(14,165,233,0.13), transparent 30%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 55%, #e7edf5 100%);
      display: grid;
      place-items: center;
      padding: 20px;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(20, 33, 54, 0.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(20, 33, 54, 0.024) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.4), transparent 92%);
    }
    .panel {
      width: min(460px, 100%);
      padding: 28px;
      border-radius: 28px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      animation: fadeInUp 360ms ease both;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 900;
      letter-spacing: 0.08em;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      box-shadow: 0 12px 28px rgba(14, 116, 144, 0.28);
    }
    .brand-copy strong {
      display: block;
      font-size: 0.98rem;
    }
    .brand-copy span {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 2px;
    }
    h1 {
      margin: 0;
      font-family: "Space Grotesk", "Sora", sans-serif;
      font-size: clamp(2rem, 5vw, 2.8rem);
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    p {
      color: var(--muted);
      line-height: 1.6;
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.74rem;
      font-weight: 700;
    }
    .alert {
      margin: 16px 0 0;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 107, 107, 0.24);
      background: rgba(255, 107, 107, 0.12);
      color: #ffcbcb;
      display: none;
    }
    form {
      margin-top: 20px;
      display: grid;
      gap: 14px;
    }
    label {
      display: grid;
      gap: 8px;
      font-size: 0.92rem;
      font-weight: 700;
    }
    input {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 12px 14px;
      font: inherit;
      outline: none;
    }
    input:focus {
      border-color: #93c5fd;
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.13);
    }
    button {
      margin-top: 4px;
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      transition: transform 140ms ease, filter 140ms ease;
    }
    button:hover {
      transform: translateY(-1px);
      filter: saturate(1.08);
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 480px) {
      body { padding: 14px; }
      .panel {
        width: 100%;
        padding: 22px;
        border-radius: 20px;
      }
      form { gap: 12px; }
    }
  </style>
</head>
  <body>
  <main class="panel">
    <div class="brand">
      <div class="brand-mark">SB</div>
      <div class="brand-copy">
        <strong>Smart Bot Spot Grid</strong>
        <span>Trading console access</span>
      </div>
    </div>
    <div id="errorBox" class="alert">Login gagal. Periksa username dan password.</div>
    <form method="post" action="/login" autocomplete="on">
      <label>
        Username
        <input name="username" type="text" required autocomplete="username" placeholder="admin">
      </label>
      <label>
        Password
        <input name="password" type="password" required autocomplete="current-password" placeholder="••••••••">
      </label>
      <button type="submit">Masuk ke Dashboard</button>
    </form>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    if (params.get("error") === "1") {
      document.getElementById("errorBox").style.display = "block";
    }
  </script>
</body>
</html>
