<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Smart Bot Trading Console Login</title>
  <meta name="description" content="Login untuk Smart Bot Dashboard">
  <style>
    :root {
      color-scheme: dark;
      --bg: #061018;
      --bg-2: #0b1722;
      --panel: rgba(11, 22, 30, 0.92);
      --line: rgba(114, 152, 170, 0.18);
      --text: #eef7fb;
      --muted: #8ea5b3;
      --accent: #48e2ae;
      --danger: #ff6b6b;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: "Bahnschrift", "Aptos", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(72, 226, 174, 0.05), transparent 24%),
        radial-gradient(circle at top left, rgba(72, 226, 174, 0.14), transparent 32%),
        radial-gradient(circle at top right, rgba(246, 198, 103, 0.12), transparent 28%),
        linear-gradient(160deg, var(--bg), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 20px;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.48), transparent 92%);
    }
    .panel {
      width: min(460px, 100%);
      padding: 28px;
      border-radius: 28px;
      background: linear-gradient(180deg, var(--panel), rgba(7, 15, 21, 0.94));
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #04110c;
      font-weight: 900;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, var(--accent), #7df1ca);
      box-shadow: 0 12px 28px rgba(72, 226, 174, 0.22);
    }
    .brand-copy strong {
      display: block;
      font-size: 0.98rem;
    }
    .brand-copy span {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 2px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 2.8rem);
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    p {
      color: var(--muted);
      line-height: 1.6;
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 0.74rem;
      font-weight: 700;
    }
    .alert {
      margin: 16px 0 0;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 107, 107, 0.24);
      background: rgba(255, 107, 107, 0.12);
      color: #ffcbcb;
      display: none;
    }
    form {
      margin-top: 20px;
      display: grid;
      gap: 14px;
    }
    label {
      display: grid;
      gap: 8px;
      font-size: 0.92rem;
      font-weight: 700;
    }
    input {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      padding: 12px 14px;
      font: inherit;
      outline: none;
    }
    input:focus {
      border-color: rgba(32, 201, 151, 0.5);
      box-shadow: 0 0 0 4px rgba(32, 201, 151, 0.12);
    }
    button {
      margin-top: 4px;
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #7df1ca);
      color: #04110c;
    }
    @media (max-width: 480px) {
      body {
        padding: 14px;
      }
      .panel {
        width: 100%;
        padding: 20px;
        border-radius: 22px;
      }
      form {
        gap: 12px;
      }
      button {
        padding: 12px 16px;
      }
    }
  </style>
</head>
  <body>
  <main class="panel">
    <div class="brand">
      <div class="brand-mark">SB</div>
      <div class="brand-copy">
        <strong>Smart Bot Futures Grid</strong>
        <span>Trading console access</span>
      </div>
    </div>
    <p class="eyebrow">Smart Bot Control Center</p>
    <h1>Masuk</h1>
    <div id="errorBox" class="alert">Login gagal. Periksa username dan password.</div>
    <form method="post" action="/login" autocomplete="on">
      <label>
        Username
        <input name="username" type="text" required autocomplete="username" placeholder="admin">
      </label>
      <label>
        Password
        <input name="password" type="password" required autocomplete="current-password" placeholder="••••••••">
      </label>
      <button type="submit">Masuk</button>
    </form>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    if (params.get("error") === "1") {
      document.getElementById("errorBox").style.display = "block";
    }
  </script>
</body>
</html>
